# FAST-Calib 配置 —— Livox MID360S + Intel RealSense D455F
/**:
  ros__parameters:
    # ---- 相机内参（D455F color 848x480，取自 camera_d455f.yaml）----
    fx: 426.799072265625
    fy: 426.08453369140625
    cx: 428.6304626464844
    cy: 247.6750946044922
    k1: -0.0554705411195755
    k2: 0.06080550700426102
    p1: -0.000496378168463707
    p2: 0.0004438387986738235

    # ---- 标定板参数（官方板默认值；务必用尺子量一下核对，尤其 marker_size）----
    marker_size: 0.20            # ArUco 标记边长(m)。官方注释提到测试数据用 0.16，量黑方块边长确认后改这里
    delta_width_qr_center: 0.55  # 两个 marker 中心水平距离的一半(m)
    delta_height_qr_center: 0.35 # 两个 marker 中心垂直距离的一半(m)
    delta_width_circles: 0.5     # 两个圆孔中心水平距离(m)
    delta_height_circles: 0.4    # 两个圆孔中心垂直距离(m)
    circle_radius: 0.12          # 圆孔半径(m)
    min_detected_markers: 4      # 至少检测到的 marker 数（板子共 4 个 ArUco marker）

    # ---- 距离滤波（只保留标定板附近的点，单位 m）----
    # 板子正对雷达时用；板子朝左/朝右时要相应放宽 y 范围
    x_min: 1.5
    x_max: 6.0
    y_min: -1.5
    y_max: 1.5
    z_min: -1.5
    z_max: 2.0

    # ---- 输入（每跑一个场景前改 bag_path / image_path）----
    lidar_topic: "/livox/lidar"
    bag_path: "/home/liu/ROS2-PX4-RW/src/FAST-Calib_ROS2/calib_data/scene1"
    image_path: "/home/liu/ROS2-PX4-RW/src/FAST-Calib_ROS2/calib_data/scene1.png"

    # ---- 输出 ----
    output_path: "/home/liu/ROS2-PX4-RW/src/FAST-Calib_ROS2/output"
